<body>
<h2>Level Load/Packing</h2>
<input id="level-file" type="file" accept=".json"/>
<input id="save-btn" type="button" value="Save"/>
<input id="pack-btn" type="button" value="Pack"/>
<h2>Editor</h2>
<div class="container">
    <div class="coords">
        <h3>Tile Coords</h3>
        <div id="tile-coords"></div>
    </div>
    <div class="coords">
      <h3>Entities</h3>
      <div id="entities"></div>
    </div>
    <div class="coords">
        <h3>Layers</h3>
        <input id="add-layer-btn" type="button" value="+"/>
        <div id="layers"></div>
    </div>
    <div class="canvas-container">
        <canvas id="editor" class="editor-canvas"></canvas>
    </div>
</div>

<!-- <script type="module" src="./level-edit.js"></script> -->
<script type="module">
	import {Editor} from './level-edit.js';
	let packBtn = document.getElementById('pack-btn');
	let packInput = document.getElementById('level-file');
  packInput.addEventListener('change', loadLevelClick);
	packBtn.addEventListener('click', packLevelClick);
	let saveBtn = document.getElementById('save-btn');
	saveBtn.addEventListener('click', saveLevelClick);
	let canvas = document.getElementById('editor');
  let layers = document.getElementById('layers');
  let coords = document.getElementById('tile-coords');
  let entities = document.getElementById('entities');
  let addLayerBtn = document.getElementById('add-layer-btn');

	let editor = new Editor({
    canvas: canvas, 
    layerDiv: layers, 
    coordDiv: coords,
    entityDiv: entities,
    addLayerBtn: addLayerBtn,
  });
  window.editor = editor;
  editor.setLevel(null);

	async function loadLevelClick() {
		let file = packInput.files[0];
		if (file) {
			const leveljson = await loadLevelFile(file);
      editor.setLevel(leveljson);
		}
	}

  async function saveLevelClick() {
    let file = packInput.files[0];
    if (file) {
      const jsonstr = JSON.stringify(editor.level, null, 2);
      const blob = new Blob([jsonstr], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const regex = /(.*)[.].*/i;
      a.download = file.name.match(regex)[1] + "." + Math.floor(Date.now() / 1000) + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  }

	async function packLevelClick() {
		let file = packInput.files[0];
		if (file) {
			const leveljson = editor.level;//await loadLevelFile(file);
			const bindata = new DataView(editor.packBin(leveljson).buffer);
			const blob = new Blob([bindata.buffer], {type: 'application/octet-stream'});
			const url = URL.createObjectURL(blob);
			const a = document.createElement('a');
			a.href = url;
			const regex = /(.*)[.].*/i;
			a.download = file.name.match(regex)[1]+ "." + Math.floor(Date.now() / 1000) + ".bin";
			document.body.appendChild(a);
			a.click();
			document.body.removeChild(a);
			URL.revokeObjectURL(url);
		}
	}

	async function loadLevelFile(file) {
		const text = await file.text();
		const json = JSON.parse(text);
		return json;
	}
